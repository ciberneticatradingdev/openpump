[package]
name = "peoplepad-curve"
version = "0.1.0"
description = "PEOPLE'S PAD bonding curve launchpad (clean-room, pump.fun-shaped)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "peoplepad_curve"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "peoplepad-amm/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "0.31.1", features = ["metadata"] }
peoplepad-amm = { path = "../peoplepad-amm", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))'] }
