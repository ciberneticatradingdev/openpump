[package]
name = "openpump-mayhem"
version = "0.1.0"
description = "OpenPump Mayhem: protocol market-making vault that buys, sells and burns mayhem-mode coins through the curve"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "openpump_mayhem"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "openpump-curve/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "0.31.1" }
openpump-curve = { path = "../openpump-curve", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))'] }
