[package]
name = "openpump-amm"
version = "0.1.0"
description = "OpenPump constant-product AMM: graduated coins trade here (clean-room, PumpSwap-shaped)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "openpump_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "openpump-fee-types/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "0.31.1" }
openpump-fee-types = { path = "../../crates/openpump-fee-types" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))'] }
