[package]
name = "openpump-curve"
version = "0.1.0"
description = "OpenPump bonding curve launchpad (clean-room, pump.fun-shaped)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "openpump_curve"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "openpump-amm/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "0.31.1", features = ["metadata"] }
openpump-amm = { path = "../openpump-amm", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))'] }
