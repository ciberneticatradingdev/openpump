[package]
name = "openpump-fee-types"
version = "0.1.0"
edition = "2021"
description = "Shared fee-program account layouts + tier selection used by the curve, the AMM and the fees program"

[lib]
crate-type = ["lib"]

[features]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))'] }
