[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
peoplepad_curve = "AmSumZo1ko2pXPKCAxp2uZwcFoQrVzNkRFf4w7EEHunB"
peoplepad_amm = "BQHw8ro8CMRQbRGDWsseCEffKksJZCqUg4K45sjA6eYb"

[programs.devnet]
peoplepad_curve = "AmSumZo1ko2pXPKCAxp2uZwcFoQrVzNkRFf4w7EEHunB"
peoplepad_amm = "BQHw8ro8CMRQbRGDWsseCEffKksJZCqUg4K45sjA6eYb"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "node_modules/.bin/ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 20000

[test.validator]
bind_address = "0.0.0.0"
ledger = ".anchor/test-ledger"
rpc_port = 8899

# Metaplex Token Metadata, dumped from mainnet (tests/fixtures), so tests run offline.
[[test.genesis]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
program = "tests/fixtures/mpl_token_metadata.so"
